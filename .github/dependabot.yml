# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 1
    open-pull-requests-limit: 999
    groups:
      artifacts:
        patterns:
          - 'actions/*-artifact'
          - 'actions/*-pages'
          - 'dawidd6/action-download-artifact'
      caches:
        patterns:
          - 'actions/cache'
          - 'actions/cache/*'
      sast:
        patterns:
          - 'github/codeql-*'
          - 'actions/dependency-review-action'
          - 'step-security/*'
          - 'microsoft/security-devops-action'
          - 'microsoft/DevSkim-Action'
          - 'ossf/*'
      setup:
        patterns:
          - 'actions/checkout'
          - 'actions/setup-*'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 1
      semver-major-days: 30
    versioning-strategy: increase
    open-pull-requests-limit: 999
    ignore:
      # Qwik 2 is a separate migration
      - dependency-name: '@builder.io/qwik*'
        update-types: ['version-update:semver-major']
      # Qwik 1.x peer dependency is `vite >=5 <8`
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
    groups:
      cloudflare:
        patterns:
          - 'wrangler'
      code-management:
        patterns:
          - 'prettier'
          - 'prettier-plugin-*'
          - '@demosjarco/prettier-config'
      design:
        patterns:
          - '@tailwindcss/*'
          - 'tailwindcss'
          - '@fontsource/*'
      qwik:
        patterns:
          - '@builder.io/qwik*'
          - 'vite'
          - 'rollup-plugin-*'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
